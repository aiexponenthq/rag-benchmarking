[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-benchmarking"
version = "1.0.0"
description = "Framework-agnostic evaluation harness for RAG and agentic AI systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ajay Pundhir" }]
keywords = ["rag", "evaluation", "benchmarking", "llm", "ai-governance", "eu-ai-act", "agentic-ai"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "python-json-logger>=2.0.7",
  "qdrant-client>=1.9",
  "sentence-transformers>=3.0",
  "numpy>=1.26",
  "tqdm>=4.66",
  "requests>=2.31",
  "ragas>=0.1.9",
  "langchain-google-genai>=2.0.9",
  "FlagEmbedding>=1.2.11",
]

[project.urls]
Homepage = "https://aiexponent.com"
Repository = "https://github.com/aiexponenthq/rag-benchmarking"
Documentation = "https://github.com/aiexponenthq/rag-benchmarking#readme"
"Bug Tracker" = "https://github.com/aiexponenthq/rag-benchmarking/issues"

[project.optional-dependencies]
test = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "httpx>=0.27",
]
# Lint/type tools pinned so CI lint runs are deterministic across the
# release window. New ruff rules (UP042, stricter I001 import-sort) shipped
# while this PR was open and surfaced as CI red on a tree that was clean
# under the prior version. Pinning here means a deliberate version bump
# is needed to flip new rules on, which is the right authoring loop.
lint = [
  "ruff==0.15.12",
  "mypy>=1.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*", "harness*"]
exclude = []

[tool.black]
line-length = 120
target-version = ["py311"]
skip-string-normalization = true

[tool.ruff]
# Bumped from 100 → 120 for v1.0 (audit RB-D9). The pre-existing codebase
# had 19 E501 lines at 101–130 chars; rather than wrap those mechanically
# we accept the modern 120-char convention and enforce it as the new floor.
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "UP", # pyupgrade
  "B",  # flake8-bugbear
  "I",  # import sorting
]
ignore = [
  "B008", # FastAPI dependency injection
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]


