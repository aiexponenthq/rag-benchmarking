name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[test]" ruff mypy

      - name: Lint (ruff check)
        run: python -m ruff check src tests

      - name: Format (ruff format --check)
        run: python -m ruff format --check src tests

      - name: Type check (mypy, non-blocking for v1.0)
        run: python -m mypy src || true

      - name: Unit tests
        run: python -m pytest tests/unit/ -v

      - name: Integration tests
        run: python -m pytest tests/integration/ -v

      - name: E2E API tests
        run: python -m pytest tests/e2e/ -v

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[test]"

      - name: pip audit
        run: pip install pip-audit && pip-audit --desc
        continue-on-error: true
